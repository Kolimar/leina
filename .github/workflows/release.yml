name: Release

# Publishes to npm with provenance when a version tag is pushed, then creates the tag's
# GitHub Release from its changelog.md section.
# The tag must match package.json's version (guarded below); publishing requires the
# NPM_TOKEN repository secret (an npm Granular Access Token with publish rights).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm --provenance (Sigstore attestation via GitHub OIDC)

jobs:
  verify:
    name: Verify (Node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  publish:
    name: Publish to npm (provenance)
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - name: Tag must match package.json version
        run: |
          PKG_V="v$(node -p "require('./package.json').version")"
          if [ "$PKG_V" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} != package.json ${PKG_V}"
            exit 1
          fi
      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

  github-release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write # create or edit the release
    steps:
      - uses: actions/checkout@v4
      # Notes = the changelog section of this version (its `## [X.Y.Z]` heading up to the next
      # `## [`), blank lines around it trimmed. A re-run edits the existing release.
      - name: Create the release from the changelog section
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          V="${TAG#v}"
          awk -v head="## [${V}]" '
            index($0, head) == 1 { f = 1; next }
            f && /^## \[/ { exit }
            f && NF == 0 { if (started) blank++; next }
            f { while (blank > 0) { print ""; blank-- } print; started = 1 }
          ' changelog.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::changelog.md has no notes for ${V} (expected a '## [${V}]' section)"
            exit 1
          fi
          FLAGS=()
          case "${V}" in *-*) FLAGS+=(--prerelease) ;; esac
          if gh release view "${TAG}" > /dev/null 2>&1; then
            gh release edit "${TAG}" --title "leina ${V}" --notes-file notes.md "${FLAGS[@]}"
          else
            gh release create "${TAG}" --title "leina ${V}" --notes-file notes.md --verify-tag "${FLAGS[@]}"
          fi
